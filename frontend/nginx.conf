server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: the app uses BrowserRouter, so URLs like /dashboard are
    # client-side routes, not files. Without this, reloading any page other
    # than / returns nginx's 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API: proxy /api/ to the backend container. This makes the
    # site usable from any device that can reach this host (LAN laptops,
    # phones) — the browser never needs to know where the backend lives,
    # and CORS never comes into play.
    location /api/ {
        proxy_pass http://backend-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
