server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: the app uses BrowserRouter, so URLs like /dashboard are
    # client-side routes, not files. Without this, reloading any page other
    # than / returns nginx's 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
