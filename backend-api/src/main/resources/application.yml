# This file contains runtime configuration for the Spring Boot backend.
# Syntax note:
#   ${ENV_NAME:defaultValue}
# means "use ENV_NAME if it exists, otherwise use defaultValue".

# Embedded web server settings.
server:
  # API server port. Locally it runs on http://localhost:8080 unless SERVER_PORT overrides it.
  port: ${SERVER_PORT:8080}

# Standard Spring Boot configuration.
spring:
  application:
    # Application name shown in logs and Spring context metadata.
    name: transparent-charity-ledger-backend

  # PostgreSQL connection used by Spring Data JPA and Flyway.
  datasource:
    # Default points to a local PostgreSQL database named charity_db.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/charity_db}
    # Default username from the project draft/docker-compose example.
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    # Default password from the project draft/docker-compose example.
    password: ${SPRING_DATASOURCE_PASSWORD:secretpassword}
    hikari:
      # Spring's default pool is 10 connections. Registration holds a request
      # thread (and its connection) for the 2-5s the orchestrator needs to
      # docker-run a node, so a classroom burst of sign-ups needs headroom.
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:30}

  # Flyway runs SQL migrations from src/main/resources/db/migration.
  flyway:
    # When true, Flyway creates/updates the schema before Hibernate validates it.
    enabled: true

  # JPA/Hibernate database behavior.
  jpa:
    hibernate:
      # validate means Hibernate checks that entity classes match the database schema.
      # It does not create or modify tables. Flyway owns schema creation.
      ddl-auto: validate
    # Avoids lazy database queries from happening accidentally while rendering HTTP responses.
    open-in-view: false
    properties:
      hibernate:
        # Makes Hibernate SQL logs easier to read if SQL logging is enabled later.
        format_sql: true

  # RabbitMQ connection used for mempool publishing and event-bus consuming.
  rabbitmq:
    # Default local RabbitMQ host.
    host: ${SPRING_RABBITMQ_HOST:localhost}
    # RabbitMQ AMQP port, not the management UI port.
    port: ${SPRING_RABBITMQ_PORT:5672}
    # Default username from the project draft/docker-compose example.
    username: ${SPRING_RABBITMQ_USERNAME:admin}
    # Default password from the project draft/docker-compose example.
    password: ${SPRING_RABBITMQ_PASSWORD:admin}

# Custom application-specific settings.
app:
  # Minutes before a PENDING transaction with no on-chain verdict is failed
  # and refunded by PendingTransactionExpiryJob. 15 is the safe default; a
  # live demo can lower it (e.g. 3) so a dead chain refunds people quickly.
  pending-expiry-minutes: ${APP_PENDING_EXPIRY_MINUTES:15}
  # Browser origin PATTERNS allowed to call this API ("*" = any, supports
  # wildcards like http://192.168.*). The site is served same-origin through
  # the frontend's nginx and auth is a Bearer header (no cookies), so the
  # permissive default is fine; restrict via APP_CORS_ALLOWED_ORIGINS if
  # this is ever exposed beyond a trusted network.
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}

  # JWT settings used by JwtService.
  jwt:
    # Secret key for signing JWTs. Replace this in production with a strong private value.
    # It must be long enough for HMAC signing; the current default is for local development only.
    secret: ${APP_JWT_SECRET:replace-this-dev-secret-with-at-least-32-characters}
    # Token lifetime in seconds. 3600 seconds = 1 hour.
    expires-in-seconds: ${APP_JWT_EXPIRES_IN_SECONDS:3600}

  # Queue names used by the messaging package.
  rabbitmq:
    # Outbound exchange: routes backend transactions into mempool_queue.
    mempool-exchange: ${APP_RABBITMQ_MEMPOOL_EXCHANGE:mempool_exchange}
    # Outbound queue: backend publishes signed/canonical transaction messages here.
    mempool-queue: ${APP_RABBITMQ_MEMPOOL_QUEUE:mempool_queue}
    # Inbound exchange: blockchain nodes publish results through this exchange.
    event-bus-exchange: ${APP_RABBITMQ_EVENT_BUS_EXCHANGE:event_bus_exchange}
    # Inbound queue: backend listens here for blockchain SUCCESS/FAILED results.
    event-bus-queue: ${APP_RABBITMQ_EVENT_BUS_QUEUE:event_bus_queue}

  # On-chain integration endpoints.
  # The NodeOrchestrator spawns one blockchain node (container) per user/campaign
  # and returns its public key + address. Each node runs a signing service that
  # signs that node's own transactions, so this backend never holds node private keys.
  onchain:
    # NodeOrchestrator base URL (POST /api/orchestrator/spawn_node).
    orchestrator-base-url: ${APP_ONCHAIN_ORCHESTRATOR_BASE_URL:http://localhost:7000}
    # Hostname pattern for per-node signing services; %d is the node index.
    # In Docker each node container is named/resolvable as node-<index>.
    node-host-pattern: ${APP_ONCHAIN_NODE_HOST_PATTERN:node-%d}
    # Port of the per-node signing service inside each node container.
    signer-port: ${APP_ONCHAIN_SIGNER_PORT:7100}
    # HTTP timeout for connect/read calls to orchestrator and signer services.
    timeout-ms: ${APP_ONCHAIN_TIMEOUT_MS:5000}
    # Number of genesis validator nodes spawned at startup (must stay 5: the
    # chain's GenesisConfig funds and stakes exactly the first five identities).
    genesis-node-count: ${APP_ONCHAIN_GENESIS_NODE_COUNT:5}

  # Demo/bootstrap admin account.
  # This exists because there is no public admin registration endpoint.
  bootstrap-admin:
    # If true, BootstrapAdminInitializer creates the admin if the email does not exist.
    enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:true}
    # Default admin username.
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
    # Default admin login email.
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@tcl.local}
    # Default admin login password. Change this outside local development.
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:Admin123!}
